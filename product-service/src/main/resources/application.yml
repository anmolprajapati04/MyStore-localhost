server:
  port: 8082

spring:
  application:
    name: product-service
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_product?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
    
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Image upload configuration
app:
  upload:
    dir: ./product-images

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka